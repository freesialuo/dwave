name: Release to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test release decisions offline
        run: node --test scripts/npm-release.test.mjs
      - name: Match tag, npm version, and Rust workspace versions
        id: validate
        run: node scripts/npm-release.mjs validate "$GITHUB_REF_NAME"

  native:
    name: Build and test release binaries
    needs: version
    uses: ./.github/workflows/native-build.yml
    with:
      release: true

  pack:
    name: Assemble and verify release tarball
    needs: [version, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      integrity: ${{ steps.verify.outputs.integrity }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/native-binaries
      - name: Stage and pack
        run: |
          node scripts/stage-npm.mjs "$RUNNER_TEMP/npm-stage" "$RUNNER_TEMP/native-binaries"
          npm pack "$RUNNER_TEMP/npm-stage" --pack-destination "$RUNNER_TEMP"
      - name: Verify archive contents, metadata, and integrity
        id: verify
        run: node scripts/npm-release.mjs verify "$GITHUB_REF_NAME" "$RUNNER_TEMP/dwave-$VERSION.tgz"
      - name: Smoke test the exact release tarball offline
        run: |
          prefix="$RUNNER_TEMP/npm-install"
          npm install --global --prefix "$prefix" --ignore-scripts --offline --no-audit --no-fund "$RUNNER_TEMP/dwave-$VERSION.tgz"
          test "$("$prefix/bin/dwave" --version)" = "dwave $VERSION"
          "$prefix/bin/dwave" --help
      - name: Upload tested npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/dwave-${{ env.VERSION }}.tgz
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Report artifact-only release
        if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED != 'true' }}
        run: |
          echo 'Trusted publishing is disabled. The verified tarball is available in the `npm-package` artifact.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish tested tarball via npm trusted publishing
    needs: [version, pack]
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXPECTED_INTEGRITY: ${{ needs.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global --ignore-scripts npm@11.17.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Publish or verify an identical existing release
        run: node scripts/npm-release.mjs publish "$GITHUB_REF_NAME" "$RUNNER_TEMP/npm-package/dwave-$VERSION.tgz" "$EXPECTED_INTEGRITY"
