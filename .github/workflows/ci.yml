name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test release decisions offline
        run: node --test scripts/npm-release.test.mjs
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  native:
    name: Native tests and npm smoke
    uses: ./.github/workflows/native-build.yml
